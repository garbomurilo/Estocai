<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio - Brasinha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <header class="bg-orange-600 text-white p-8 text-center rounded-b-[40px] shadow-lg">
        <h1 class="text-3xl font-black tracking-tight mb-2">O Brasinha</h1>
        <p class="text-orange-200 font-medium">Faça seu pedido direto no caixa</p>
    </header>

    <main class="max-w-md mx-auto p-6 mt-4 space-y-6" id="lista-cardapio">
        <p class="text-center text-gray-400 italic my-10">Carregando cardápio...</p>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
        import { firebaseConfig } from './firebase-config.js';

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        lucide.createIcons();

        async function carregarCardapio() {
            const container = document.getElementById('lista-cardapio');
            try {
                const snapshot = await getDocs(collection(db, "produtos"));
                let htmlFinal = "";

                snapshot.forEach(doc => {
                    const p = doc.data();
                    if (p.ativo === true && p.tipo_estoque === 'DIA') {
                        htmlFinal += `
                            <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 flex justify-between items-center hover:shadow-md transition-shadow">
                                <div>
                                    <h3 class="font-bold text-gray-800 text-lg">${p.nome}</h3>
                                    <p class="text-xs text-orange-500 uppercase font-bold tracking-wider mt-1">${p.categoria}</p>
                                </div>
                                <div class="bg-orange-50 px-4 py-2 rounded-xl border border-orange-100">
                                    <span class="font-black text-orange-700">R$ ${p.preco.toFixed(2)}</span>
                                </div>
                            </div>
                        `;
                    }
                });

                container.innerHTML = htmlFinal || "<p class='text-center text-gray-500'>Nenhum produto disponível no momento.</p>";

            } catch (error) {
                console.error("Erro ao carregar cardápio:", error);
                container.innerHTML = "<p class='text-center text-red-500'>Erro ao carregar o cardápio.</p>";
            }
        }
        carregarCardapio();
    </script>
</body>
</html>
